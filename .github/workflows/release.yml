name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '请输入发布版本号 (例如 v1.1.0)'
        required: true
        default: 'v1.0.0'
        type: string
      release_body:
        description: '请输入发布内容 (支持 Markdown)'
        required: false
        default: '本次更新内容如下：'
        type: string
      build_debug:
        description: '同时构建 Debug APK（debuggable，用于真机排查崩溃）'
        required: false
        default: 'false'
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-gnullvm

      - name: Cache LLVM-MinGW
        id: cache-llvm-mingw
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}\llvm-mingw
          key: ${{ runner.os }}-llvm-mingw-20260812

      - name: Install LLVM-MinGW (gnullvm toolchain)
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $llvmMingwVersion = "20260812"
          $archiveName = "llvm-mingw-${llvmMingwVersion}-ucrt-x86_64.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/${llvmMingwVersion}/${archiveName}"
          $zipPath = "$env:RUNNER_TEMP\llvm-mingw.zip"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP\llvm-mingw" -Force
          Remove-Item $zipPath

      - name: Configure Linker and Clean PATH
        shell: pwsh
        run: |
          $extractedDir = Get-ChildItem "$env:RUNNER_TEMP\llvm-mingw" -Directory | Select-Object -First 1
          $binPath = Join-Path $extractedDir.FullName 'bin'
          Add-Content -Path $env:GITHUB_PATH -Value $binPath
          $cleanPath = ($env:PATH -split ';' | Where-Object { 
              $_ -notlike '*Strawberry*c\bin*' -and 
              $_ -notlike '*mingw64\bin*' -and 
              $_ -notlike '*mingw32\bin*'
          }) -join ';'
          echo "PATH=$cleanPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-gnullvm

      - name: Prepare Release Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path staging
          Copy-Item "target/x86_64-pc-windows-gnullvm/release/koala-rust.exe" -Destination "staging/koala.exe"
          Compress-Archive -Path "staging/*" -DestinationPath "koala-windows-x64-gnullvm.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: koala-windows-x64-gnullvm.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: 'platforms;android-37 build-tools;36.1.0 ndk;30.0.16248370'
          accept-android-sdk-licenses: true

      - name: Install Rust targets
        run: |
          rustup target add aarch64-linux-android

      - name: Cache cargo-ndk
        id: cache-cargo-ndk
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}

      - name: Install cargo-ndk
        if: steps.cache-cargo-ndk.outputs.cache-hit != 'true'
        run: cargo install cargo-ndk

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Rust core (.so)
        env:
          ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/30.0.16248370
        run: |
          cargo ndk -t arm64-v8a -p koala-rust build --release
          ls -la target/aarch64-linux-android/release/*.so

      - name: Generate Kotlin bindings (UniFFI)
        run: |
          cargo run --bin uniffi-bindgen -- generate src/koala.udl \
            --language kotlin --out-dir android/app/src/main/kotlin --no-format
          grep -rh "^package" android/app/src/main/kotlin | sort -u

      - name: Copy .so into jniLibs
        run: |
          JNILIBS=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNILIBS"
          SO=target/aarch64-linux-android/release/libkoala_rust.so
          cp "$SO" "$JNILIBS/libkoala_rust.so"
          # UniFFI 0.32 绑定用 JNA Native.register(componentName="koala")，加载 libuniffi_koala.so
          COMPONENT=$(grep -rhoE 'componentName = "[^"]+"' android/app/src/main/kotlin \
            | sed -E 's/.*"(.+)".*/\1/' | head -n 1)
          echo "UniFFI component: $COMPONENT"
          if [ -n "$COMPONENT" ]; then
            cp "$SO" "$JNILIBS/libuniffi_$COMPONENT.so"
          fi
          ls -la "$JNILIBS"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.2'

      - name: Build Release APK (Gradle)
        run: gradle assembleRelease -p android --no-daemon

      - name: Decode Keystore
        run: |
          mkdir -p /home/runner/.android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /home/runner/.android/release.keystore

      - name: Align and Sign APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.1.0"
          UNSIGNED_APK=android/app/build/outputs/apk/release/app-release-unsigned.apk

          "$BUILD_TOOLS/zipalign" -p -f 4 "$UNSIGNED_APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks /home/runner/.android/release.keystore \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out KoalaMusic-signed.apk aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose KoalaMusic-signed.apk

      - name: Prepare Android Package
        run: |
          mkdir -p staging
          cp KoalaMusic-signed.apk staging/koala-android-arm64.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-package
          path: staging/*.apk

      - name: Build Debug APK (debuggable)
        if: inputs.build_debug == 'true'
        run: gradle assembleDebug -p android --no-daemon

      - name: Sign Debug APK
        if: inputs.build_debug == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.1.0"
          DEBUG_APK=android/app/build/outputs/apk/debug/app-debug.apk

          "$BUILD_TOOLS/zipalign" -p -f 4 "$DEBUG_APK" debug-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks /home/runner/.android/release.keystore \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out KoalaMusic-debug.apk debug-aligned.apk

      - name: Upload Debug APK
        if: inputs.build_debug == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-debug
          path: KoalaMusic-debug.apk

  create-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-package/koala-windows-x64-gnullvm.zip
            android-package/*.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          name: "kmd ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}"
          body: ${{ github.event_name == 'workflow_dispatch' && inputs.release_body || 'Automated Windows x64 gnullvm and Android build.' }}
          generate_release_notes: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.KOALA_MUSIC_TOKEN }}
