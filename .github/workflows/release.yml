name: Release Build

on:
  push:
    tags:
      - 'v*' # 推送 v 开头的 tag 时自动触发
  workflow_dispatch:
    inputs:
      version:
        description: '请输入发布版本号 (例如 v1.1.0)'
        required: true
        default: 'v1.0.0'
        type: string

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 安装匹配 gnullvm 的 Rust 工具链
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-gnullvm

      # 2. 自动安装 LLVM/Clang 链接器环境
      - name: Install LLVM Clang Linker
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '17'

      # 3. 核心桥接：为 gnullvm 制造它强行要求的特定名字链接器替身
      - name: Create gnullvm Linker Alias
        shell: powershell
        run: |
          $clangPath = (Get-Command clang).Source
          $clangDir = Split-Path $clangPath
          Write-Host "Found clang at: $clangPath"
          
          # 复制并重命名为 gnullvm 专属的交叉编译链接器名字
          Copy-Item "$clangDir\clang.exe" "$clangDir\x86_64-w64-mingw32-clang.exe" -Force
          Copy-Item "$clangDir\clang++.exe" "$clangDir\x86_64-w64-mingw32-clang++.exe" -Force
          
          # 将该路径加入环境变量，确保 Cargo 能找到它
          echo "$clangDir" >> $env:GITHUB_PATH
          Write-Host "Linker alias created successfully!"

      # 4. 缓存 Cargo 依赖，加速编译
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # 5. 使用 gnullvm 目标进行 Release 编译
      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-gnullvm

      # 6. 使用 PowerShell 打包产物
      - name: Prepare Release Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path staging
          
          # 复制编译好的主程序
          Copy-Item "target/x86_64-pc-windows-gnullvm/release/koala-rust.exe" -Destination "staging/koala.exe"
          
          # 复制 ui 资源文件夹（如果存在）
          if (Test-Path "ui") { Copy-Item -Path "ui" -Destination "staging/ui" -Recurse }
          
          # 打包成 zip 压缩包
          Compress-Archive -Path "staging/*" -DestinationPath "koala-windows-x64-gnullvm.zip"

      # 7. 自动创建 GitHub Release 并上传
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: koala-windows-x64-gnullvm.zip
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          name: "Release ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}"
          body: "Automated Windows x64 gnullvm build for version ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}."
        env:
          GITHUB_TOKEN: ${{ secrets.KOALA_MUSIC_TOKEN }}
