name: Release Build

on:
  push:
    tags:
      - 'v*' # 推送 v 开头的 tag 时自动触发
  workflow_dispatch:
    inputs:
      version:
        description: '请输入发布版本号 (例如 v1.1.0)'
        required: true
        default: 'v1.0.0'
        type: string

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. 安装 Rust 工具链和 gnullvm 目标
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-gnullvm

      # 2. 缓存 llvm-mingw 工具链，显著缩短 CI 时间
      - name: Cache LLVM-MinGW
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\llvm-mingw
          key: ${{ runner.os }}-llvm-mingw-20260812

      # 3. 下载并安装 llvm-mingw 预编译包（仅在缓存未命中时执行）
      - name: Install LLVM-MinGW (gnullvm toolchain)
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $llvmMingwVersion = "20260812" # 固定版本，便于缓存
          $archiveName = "llvm-mingw-${llvmMingwVersion}-ucrt-x86_64.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/${llvmMingwVersion}/${archiveName}"
          $zipPath = "$env:RUNNER_TEMP\llvm-mingw.zip"
          
          Write-Host "Downloading LLVM-MinGW $llvmMingwVersion ..."
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP\llvm-mingw" -Force
          Remove-Item $zipPath

      # 4. 将 llvm-mingw 的 bin 目录添加到 PATH，并清理冲突路径
      - name: Configure Linker and Clean PATH
        shell: pwsh
        run: |
          # 找到解压后的 llvm-mingw 目录
          $extractedDir = Get-ChildItem "$env:RUNNER_TEMP\llvm-mingw" -Directory | Select-Object -First 1
          $binPath = Join-Path $extractedDir.FullName 'bin'
          
          # 将 llvm-mingw 的 bin 目录置顶到 PATH
          Add-Content -Path $env:GITHUB_PATH -Value $binPath
          Write-Host "Added $binPath to PATH"
          
          # 关键：从 PATH 中移除可能冲突的路径（Strawberry Perl, 传统 MinGW）
          $cleanPath = ($env:PATH -split ';' | Where-Object { 
              $_ -notlike '*Strawberry*c\bin*' -and 
              $_ -notlike '*mingw64\bin*' -and 
              $_ -notlike '*mingw32\bin*'
          }) -join ';'
          echo "PATH=$cleanPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "PATH cleaned successfully."

          # 验证链接器
          clang --version
          ld.lld --version

      # 5. 缓存 Cargo 依赖，加速编译
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # 6. 使用 gnullvm 目标进行 Release 编译
      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-gnullvm

      # 7. 使用 PowerShell 打包产物
      - name: Prepare Release Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path staging
          
          # 复制编译好的主程序
          Copy-Item "target/x86_64-pc-windows-gnullvm/release/koala-rust.exe" -Destination "staging/koala.exe"
          
          # 复制 ui 资源文件夹（如果存在）
          if (Test-Path "ui") { Copy-Item -Path "ui" -Destination "staging/ui" -Recurse }
          
          # 打包成 zip 压缩包
          Compress-Archive -Path "staging/*" -DestinationPath "koala-windows-x64-gnullvm.zip"

      # 8. 自动创建 GitHub Release 并上传
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: koala-windows-x64-gnullvm.zip
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          name: "Release ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}"
          body: "Automated Windows x64 gnullvm build for version ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}."
        env:
          GITHUB_TOKEN: ${{ secrets.KOALA_MUSIC_TOKEN }}
