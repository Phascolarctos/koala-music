name: Release Build

on:
  push:
    tags:
      - 'v*' # 推送 v 开头的 tag（如 v1.0.0）时自动触发
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 安装匹配你本地 gnullvm 的 Rust 稳定版工具链
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-gnullvm

      # 缓存 Cargo 依赖，大幅缩短编译时间
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      # 使用 gnullvm 目标进行 Release 编译
      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-gnullvm

      # 使用 PowerShell 打包产物
      - name: Prepare Release Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path staging
          
          # 1. 复制编译好的主程序
          Copy-Item "target/x86_64-pc-windows-gnullvm/release/koala-rust.exe" -Destination "staging/koala.exe"
          
          # 2. 复制你的 ui 资源文件夹（里面包含了 icons/koala.svg 等）
          if (Test-Path "ui") { Copy-Item -Path "ui" -Destination "staging/ui" -Recurse }
          
          # 3. 打包成 zip 压缩包
          Compress-Archive -Path "staging/*" -DestinationPath "koala-windows-x64-gnullvm.zip"

      # 自动创建 GitHub Release 并上传 zip 压缩包
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: koala-windows-x64-gnullvm.zip
        env:
          GITHUB_TOKEN: ${{ secrets.KOALA_MUSIC_TOKEN }}
