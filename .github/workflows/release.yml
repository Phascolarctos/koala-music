name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '请输入发布版本号 (例如 v1.1.0)'
        required: true
        default: 'v1.0.0'
        type: string
      release_body:
        description: '请输入发布内容 (支持 Markdown)'
        required: false
        default: '本次更新内容如下：'
        type: string

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-gnullvm

      - name: Cache LLVM-MinGW
        id: cache-llvm-mingw
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}\llvm-mingw
          key: ${{ runner.os }}-llvm-mingw-20260812

      - name: Install LLVM-MinGW (gnullvm toolchain)
        if: steps.cache-llvm-mingw.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $llvmMingwVersion = "20260812"
          $archiveName = "llvm-mingw-${llvmMingwVersion}-ucrt-x86_64.zip"
          $url = "https://github.com/mstorsjo/llvm-mingw/releases/download/${llvmMingwVersion}/${archiveName}"
          $zipPath = "$env:RUNNER_TEMP\llvm-mingw.zip"
          Invoke-WebRequest -Uri $url -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath "$env:RUNNER_TEMP\llvm-mingw" -Force
          Remove-Item $zipPath

      - name: Configure Linker and Clean PATH
        shell: pwsh
        run: |
          $extractedDir = Get-ChildItem "$env:RUNNER_TEMP\llvm-mingw" -Directory | Select-Object -First 1
          $binPath = Join-Path $extractedDir.FullName 'bin'
          Add-Content -Path $env:GITHUB_PATH -Value $binPath
          $cleanPath = ($env:PATH -split ';' | Where-Object { 
              $_ -notlike '*Strawberry*c\bin*' -and 
              $_ -notlike '*mingw64\bin*' -and 
              $_ -notlike '*mingw32\bin*'
          }) -join ';'
          echo "PATH=$cleanPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-gnullvm

      - name: Prepare Release Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path staging
          Copy-Item "target/x86_64-pc-windows-gnullvm/release/koala-rust.exe" -Destination "staging/koala.exe"
          Compress-Archive -Path "staging/*" -DestinationPath "koala-windows-x64-gnullvm.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: koala-windows-x64-gnullvm.zip

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'
          accept-android-sdk-licenses: true

      - name: Install Rust targets
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Cache cargo-apk
        id: cache-cargo-apk
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-apk
          key: cargo-apk-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-apk-${{ runner.os }}-

      - name: Install cargo-apk
        if: steps.cache-cargo-apk.outputs.cache-hit != 'true'
        run: cargo install cargo-apk

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Decode Keystore
        run: |
          mkdir -p /home/runner/.android
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /home/runner/.android/release.keystore

      - name: Build Signed Android APK
        env:
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CARGO_APK_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CARGO_APK_RELEASE_KEYSTORE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cargo apk build --target aarch64-linux-android --lib --release

      - name: Prepare Android Package
        run: |
          mkdir -p staging
          find target -name "*.apk" -exec cp {} staging/koala-android-arm64.apk \;

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-package
          path: staging/*.apk

  create-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows-package/koala-windows-x64-gnullvm.zip
            android-package/*.apk
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          name: "kmd ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}"
          body: ${{ github.event_name == 'workflow_dispatch' && inputs.release_body || 'Automated Windows x64 gnullvm and Android build.' }}
          generate_release_notes: ${{ github.event_name == 'push' }}
        env:
          GITHUB_TOKEN: ${{ secrets.KOALA_MUSIC_TOKEN }}
