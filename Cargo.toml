[package]
name = "koala-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = [
    "std",
    "serde",
] }
crossbeam-channel = "0.5.17"
lofty = "0.25.4"
ncmmiao = "3.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = "1.18.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.18.0"

[target.'cfg(target_os = "android")'.dependencies]
log = "0.4"
slint = { version = "1.19.0", features = ["backend-android-activity-06"] }
android_logger = "0.15.1"

[build-dependencies]
slint-build = "1.18.1"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
opt-level = 3

[profile.release.package."*"]
opt-level = 3

[package.metadata.android]
package = "com.koala.music"
apk_name = "KoalaMusic"
build_targets = [ "aarch64-linux-android" ]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 37
max_sdk_version = 37

[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW", "android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 37

# cargo-apk2 要求 release 构建必须配置签名，否则报错退出。
# CI 中通过环境变量 CARGO_APK_RELEASE_KEYSTORE / CARGO_APK_RELEASE_KEYSTORE_PASSWORD
# 覆盖此配置（优先级高于 manifest），最终由 apksigner 使用完整 secrets 签名。
# 本地调试时可把 path 改为真实 keystore 路径。
[package.metadata.android.signing.release]
path = "release.keystore"
keystore_password = "android"
