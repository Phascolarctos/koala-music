[package]
name = "koala-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
fs = "0.0.6"
ncmmiao = "3.14.0"
rfd = "0.17.2"
serde = "1.0.229"
serde_json = "1.0.154"
slint = "1.18.1"

[target.'cfg(target_os = "android")'.dependencies]
log = "0.4"
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }
android_logger = "0.13"
android-activity = { version = "0.6", features = ["native-activity"] }

[package.metadata.android.sdk]
min_sdk_version = 35
target_sdk_version = 35

[build-dependencies]
slint-build = "1.18.1"

[lib]
crate-type = ["cdylib"]

[profile.release]
codegen-units = 1
lto = true
