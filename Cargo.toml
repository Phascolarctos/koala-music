[package]
name = "koala-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = [
    "std",
    "serde",
] }
crossbeam-channel = "0.5.17"
lofty = "0.25.4"
ncmmiao = "3.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = "1.18.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.17.2"

[target.'cfg(target_os = "android")'.dependencies]
log = "0.4"
slint = { version = "1.18.1", features = ["backend-android-activity-06"] }
android_logger = "0.13"


[package.metadata.android]
package = "com.koala.music"
label = "Koala Music"
version_code = 100
version_name = "0.1.0"

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

# [[package.metadata.android.uses_permission]]
# name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_AUDIO"

[package.metadata.android.sdk]
min_sdk_version = 35
target_sdk_version = 35

[package.metadata.android.signing.release]
path = "/home/runner/.android/release.keystore"

[build-dependencies]
slint-build = "1.18.1"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
opt-level = 3

[profile.release.package."*"]
opt-level = 3
